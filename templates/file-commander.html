<div class="sfc-app" tabindex="0">
  <section class="sfc-split">
    {{> "modules/sephrals-file-commander/templates/pane.html" pane=panes.left side="left"}}

    {{> "modules/sephrals-file-commander/templates/pane.html" pane=panes.right side="right"}}
  </section>

  <div class="sfc-status-line" title="{{status}}">{{status}}</div>

  {{#if canUpload}}
  <label class="sfc-webp-option">
    <input type="checkbox" name="webp" {{#if webpChecked}}checked{{/if}}>
    <span>{{labels.webp}}</span>
  </label>
  {{/if}}

  <footer class="sfc-function-bar">
    {{#each commandBar}}
    <button
      type="button"
      class="sfc-function-key {{#if disabled}}is-disabled{{/if}}"
      {{#unless disabled}}data-action="{{action}}"{{/unless}}
      {{#if disabled}}disabled{{/if}}
    >
      <span class="sfc-function-keycode">{{key}}</span>
      <span class="sfc-function-label">{{label}}</span>
    </button>
    {{/each}}
  </footer>
</div>
